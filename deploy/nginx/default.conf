server {
    listen 80;
    server_name kis-thl.de www.kis-thl.de;

    client_max_body_size 500M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes on encrypted, a password must never travel in the clear.
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    server_name kis-thl.de www.kis-thl.de;

    client_max_body_size 500M;

    # All requests (incl. /api) go through Next.js: the chat stream and other endpoints
    # rely on Next.js route handlers/rewrites that rewrite the path (e.g.
    # /api/ai-assistant-stream/<uuid> -> backend /ai-assistant/workspaces/<uuid>/chat).
    # A direct nginx /api -> backend proxy bypasses those and 404s the chat.
    # Parts of a direct upload go unbuffered to the bucket of S3_ENDPOINT, Hetzner answers no CORS for private buckets.
    location ^~ /bucket-upload/ {
        limit_except PUT { deny all; }
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host nbg1.your-objectstorage.com;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name nbg1.your-objectstorage.com;
        proxy_pass https://nbg1.your-objectstorage.com/;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/kis-thl.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kis-thl.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
