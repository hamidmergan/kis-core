# Hetzner server only: nginx with TLS in front of the stack, loaded by deploy/start-nginx.sh.
# Paths are relative to the repo root, because docker-compose.yml is the first file.

services:
  nginx:
    image: nginx:alpine
    container_name: kis-nginx
    oom_score_adj: -500
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
