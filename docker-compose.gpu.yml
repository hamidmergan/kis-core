# GPU-Tweaks fuer lokale Entwicklung mit NVIDIA GPU
# Wird in start-local.bat explizit per -f geladen

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery-worker-general:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Swappt CPU-Image gegen GPU-Image und reserviert GPU
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
