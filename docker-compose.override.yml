# Lokale Entwicklung — wird automatisch von Docker Compose geladen
# start-nginx.sh nutzt explizit -f docker-compose.yml, daher auf dem Server ignoriert

services:
  backend:
    command: python -m uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src

  celery-worker-screencast:
    volumes:
      - ./backend/src:/app/src

  celery-worker-general:
    volumes:
      - ./backend/src:/app/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery-worker-dubbing:
    volumes:
      - ./backend/src:/app/src

  celery-beat:
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules

  adminer:
    profiles: []

  minio:
    profiles: []

  kokoro:
    profiles: []

  ollama:
    profiles: []

  openldap:
    profiles: []

  phpldapadmin:
    profiles: []
