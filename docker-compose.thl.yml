# isy-kis-thl (THL server), loaded explicitly via -f by deploy/start-thl.sh.
# The THL system nginx sits in front, so there is no nginx container here,
# and files stay in the external bucket, so there is no MinIO either.

services:

  # One image for all backend containers: eight separate builds filled the 38 GB disk.
  # Only backend builds it, the others reuse it.
  backend:
    image: kis-backend:thl

  celery-worker-screencast:
    image: kis-backend:thl
    build: !reset null

  celery-worker-general:
    image: kis-backend:thl
    build: !reset null

  celery-worker-long:
    image: kis-backend:thl
    build: !reset null

  celery-worker-voice:
    image: kis-backend:thl
    build: !reset null

  celery-worker-control:
    image: kis-backend:thl
    build: !reset null

  celery-worker-aia:
    image: kis-backend:thl
    build: !reset null

  celery-beat:
    image: kis-backend:thl
    build: !reset null
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-frontend
    # Serves every page, when memory runs out the kernel takes a worker before this.
    oom_score_adj: -500
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # localhost only, the THL nginx reaches it on 127.0.0.1:3000
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
