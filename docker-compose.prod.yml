# Production-Only — wird nur explizit via -f auf dem Server geladen
# Lokal NICHT angefasst (Frontend laeuft lokal via 'cd frontend && npm run dev')

services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # Nur localhost. nginx erreicht das Frontend intern ueber das Docker-Netz
      # (frontend:3000). Frueher lag 3000 offen auf 0.0.0.0 und umging so TLS.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
