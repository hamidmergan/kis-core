# Production only, loaded explicitly via -f on the server.
# NOT touched locally (the frontend runs via 'cd frontend && npm run dev').

services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # localhost only. nginx reaches the frontend internally over the Docker network
      # (frontend:3000). Port 3000 used to sit open on 0.0.0.0 and so bypassed TLS.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
