# Lokale Entwicklung. Explizit via -f in start-local.bat/sh geladen.
# Auf dem Server nicht genutzt.

services:
  # ── Hot-Reload-Tweaks ──────────────────────────────────────────────────
  backend:
    command: python -m uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src

  celery-worker-screencast:
    volumes:
      - ./backend/src:/app/src

  celery-worker-general:
    volumes:
      - ./backend/src:/app/src

  celery-worker-kia:
    volumes:
      - ./backend/src:/app/src

  celery-beat:
    volumes:
      - ./backend/src:/app/src

  # ── Dev-Only Services ──────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: kis-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  # Live log viewer for all containers. Local only — not suitable for production
  # (no auth, reads docker.sock read-only). Bind to 127.0.0.1 to avoid LAN exposure.
  dozzle:
    image: amir20/dozzle:latest
    container_name: kis-dozzle
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    restart: unless-stopped

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: kis-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8090:80"
    depends_on:
      - openldap
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: kis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kis-minio-data:/data
    restart: unless-stopped

  # CPU-Image als Default; gpu.yml swappt auf GPU-Image und reserviert NVIDIA
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kis-kokoro
    environment:
      - API_KEY=${KOKORO_API_KEY:-kokoro-local-key}
    ports:
      - "8880:8880"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  thorsten:
    build: ./docker/thorsten
    container_name: kis-thorsten
    ports:
      - "5002:5002"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  ollama:
    image: ollama/ollama
    container_name: kis-ollama
    ports:
      - "11434:11434"
    volumes:
      - kis-ollama-data:/root/.ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  langfuse-db-init:
    image: postgres:16-alpine
    container_name: kis-langfuse-db-init
    command: >
      sh -c "psql postgresql://kis:kis-local-dev@postgres:5432/kis -c 'CREATE DATABASE langfuse;' 2>/dev/null || true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    image: langfuse/langfuse:2
    container_name: kis-langfuse
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://kis:kis-local-dev@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-local-secret-change-in-prod
      SALT: langfuse-local-salt-change-in-prod
      LANGFUSE_INIT_ORG_ID: kis
      LANGFUSE_INIT_ORG_NAME: KIS-THL
      LANGFUSE_INIT_PROJECT_ID: kia
      LANGFUSE_INIT_PROJECT_NAME: KI-Tutor
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: lf-pk-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: lf-sk-local
      LANGFUSE_INIT_USER_EMAIL: admin@th-luebeck.de
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kis-minio-data:
  kis-ollama-data:
