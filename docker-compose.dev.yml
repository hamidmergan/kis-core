# Local development: hot reload, Adminer and Langfuse. Switched on via COMPOSE_FILE
# in .env, see the development lines in .env.example. Not used on the servers.

services:
  # ── Hot-Reload-Tweaks ──────────────────────────────────────────────────
  backend:
    # --timeout-graceful-shutdown: otherwise the reload hangs forever on open SSE streams
    command: python -m uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5
    volumes:
      - ./backend/src:/app/src

  celery-worker-screencast:
    volumes:
      - ./backend/src:/app/src

  celery-worker-general:
    volumes:
      - ./backend/src:/app/src

  celery-worker-aia:
    volumes:
      - ./backend/src:/app/src

  celery-worker-voice:
    volumes:
      - ./backend/src:/app/src

  celery-worker-control:
    volumes:
      - ./backend/src:/app/src

  celery-beat:
    volumes:
      - ./backend/src:/app/src

  # ── Dev-Only Services ──────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    container_name: kis-adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped


  langfuse-db-init:
    image: postgres:16-alpine
    container_name: kis-langfuse-db-init
    command: >
      sh -c "psql postgresql://kis:kis-local-dev@postgres:5432/kis -c 'CREATE DATABASE langfuse;' 2>/dev/null || true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    image: langfuse/langfuse:2
    container_name: kis-langfuse
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://kis:kis-local-dev@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-local-secret-change-in-prod
      SALT: langfuse-local-salt-change-in-prod
      LANGFUSE_INIT_ORG_ID: kis
      LANGFUSE_INIT_ORG_NAME: KIS-THL
      LANGFUSE_INIT_PROJECT_ID: aia
      LANGFUSE_INIT_PROJECT_NAME: KI-Tutor
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: lf-pk-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: lf-sk-local
      LANGFUSE_INIT_USER_EMAIL: admin@th-luebeck.de
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

