services:
  redis:
    image: redis:alpine
    container_name: kis-redis
    restart: unless-stopped
    # No ports exposed - only accessible via internal Docker network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kis-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kis-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-kis}
    volumes:
      - kis-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kis} -d ${POSTGRES_DB:-kis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kis-backend
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - ./backend/tests:/app/tests:ro
      # pytest config (testpaths + asyncio_mode). Without it, in-container test
      # runs need `-o asyncio_mode=auto` and 18 async tests fail as "not supported".
      - ./backend/pytest.ini:/app/pytest.ini:ro
      - kis-storage:/app/storage
    ports:
      # Nur an localhost binden, nicht ans oeffentliche Interface. nginx und der
      # Frontend-Container erreichen das Backend intern ueber das Docker-Netz
      # (backend:8000); nur lokale Host-Tools brauchen den veroeffentlichten Port.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-screencast:
    build: ./backend
    container_name: kis-celery-screencast
    command: celery -A src.celery_app worker --queues=screencast --concurrency=2 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-general:
    build: ./backend
    container_name: kis-celery-general
    command: celery -A src.celery_app worker --queues=tts,general --autoscale=10,2 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-aia:
    build: ./backend
    container_name: kis-celery-aia
    command: celery -A src.celery_app worker --queues=aia --autoscale=12,2 --loglevel=info
    mem_limit: 1.5g
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-beat:
    build: ./backend
    container_name: kis-celery-beat
    command: celery -A src.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-celerybeat:/app/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  openldap:
    image: osixia/openldap:latest
    container_name: kis-openldap
    environment:
      LDAP_ORGANISATION: TH Luebeck
      LDAP_DOMAIN: th-luebeck.de
      # In prod ueber .env auf ein starkes Passwort setzen. Default nur fuer
      # lokale Entwicklung. Achtung: osixia/openldap setzt das Admin-Passwort
      # nur beim ERSTEN Init im Volume, ein spaeterer Wechsel braucht ldappasswd
      # oder ein frisches Volume.
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      LDAP_TLS: "false"
    ports:
      # Nur localhost. Das Backend erreicht LDAP intern ueber das Docker-Netz
      # (LDAP_SERVER=kis-openldap), niemand von aussen. Frueher lag 389 offen
      # auf 0.0.0.0, also am oeffentlichen Interface der Prod-Box.
      - "127.0.0.1:389:389"
    volumes:
      - ./docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
      - kis-openldap-data:/var/lib/ldap
      - kis-openldap-config:/etc/ldap/slapd.d
    command: --copy-service
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-D", "cn=admin,dc=th-luebeck,dc=de", "-w", "${LDAP_ADMIN_PASSWORD:-admin}", "-b", "dc=th-luebeck,dc=de"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ldap-init:
    image: alpine:latest
    container_name: kis-ldap-init
    command: >
      sh -c "
        apk add --no-cache openldap-clients &&
        ldapadd -x -H ldap://openldap -D 'cn=admin,dc=th-luebeck,dc=de' -w '${LDAP_ADMIN_PASSWORD:-admin}' -f /seed/seed.ldif 2>&1 || true
      "
    volumes:
      - ./docker/ldap/seed.ldif:/seed/seed.ldif:ro
    depends_on:
      openldap:
        condition: service_healthy
    restart: "no"

volumes:
  kis-postgres-data:
  kis-celerybeat:
  kis-storage:
  kis-openldap-data:
  kis-openldap-config:
