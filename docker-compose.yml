services:
  backend:
    build: ./backend
    container_name: kis-thl-backend
    env_file:
      - .env
    volumes:
      - ./backend/demo:/app/demo:ro
      - kis-thl-db:/app/data
      - kis-thl-storage:/app/storage
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-thl-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: kis-thl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  openldap:
    profiles: ["ldap"]
    image: tiredofit/openldap:latest
    container_name: kis-thl-openldap
    environment:
      HOSTNAME: openldap
      ORGANIZATION: TH Luebeck
      DOMAIN: th-luebeck.de
      ADMIN_PASS: admin
      ENABLE_TLS: "FALSE"
      LOG_LEVEL: 256
    ports:
      - "389:389"
    volumes:
      - ./ldap/seed.ldif:/assets/slapd/bootstrap/ldif/seed.ldif
      - kis-thl-openldap-data:/var/lib/ldap
      - kis-thl-openldap-config:/etc/ldap/slapd.d
    restart: unless-stopped

volumes:
  kis-thl-db:
  kis-thl-storage:
  kis-thl-openldap-data:
  kis-thl-openldap-config:
