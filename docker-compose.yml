services:
  redis:
    image: redis:alpine
    container_name: kis-redis
    restart: unless-stopped
    # No ports exposed - only accessible via internal Docker network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kis-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kis-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-kis}
    # Speicherwerte aus dem vorhandenen RAM berechnen statt fest einzutragen.
    # Postgres nimmt ohne Angabe 128 MB shared_buffers, egal wie gross der Server
    # ist. Das ist ein Startwert fuer Mini-Systeme, kein Betriebswert. Mit dieser
    # Zeile passt sich alles nach einem Server-Upgrade von allein an, ohne dass
    # jemand daran denken muss.
    #
    # Ein ACHTEL des RAM als shared_buffers, nicht das Viertel aus der
    # Postgres-Doku. Grund: die Viertel-Regel gilt fuer einen reinen
    # Datenbankserver. Hier laufen auf derselben Maschine zusaetzlich backend,
    # frontend, drei Celery-Container, LDAP, nginx und MinIO.
    #
    # Gemessen am 2026-07-29 (hnsw-Suche, 823 MB Index, 138.511 Abschnitte):
    #   128 MB  -> 0,9 ms je Suche
    #   1983 MB -> 0,6 ms je Suche
    # Der Gewinn ist also 0,3 ms, waehrend eine Chatanfrage Sekunden braucht.
    # Grund fuer den kleinen Unterschied: das Betriebssystem haelt die Indexdatei
    # ohnehin in seinem eigenen Zwischenspeicher. Ein grosses shared_buffers
    # nimmt genau diesem Zwischenspeicher den Platz weg.
    #
    # Warum dann nicht bei 128 MB bleiben: der Zwischenspeicher des
    # Betriebssystems ist niemandem zugesichert. Laeuft eine Video-Transkription
    # oder mehrere Uploads, verdraengt das die Indexdaten daraus. shared_buffers
    # wird nicht verdraengt. Ein knappes Gigabyte ist die Versicherung dagegen,
    # ohne dem Rest der Plattform 2 GB wegzunehmen.
    #
    # effective_cache_size bleibt bei der Haelfte des RAM, das ist nur eine
    # Schaetzung fuer den Abfrageplaner und belegt nichts. max_connections
    # waechst mit, weil bei mehreren Backend-Prozessen und den Celery-Workern je
    # ein eigener Verbindungsvorrat entsteht (core/db/pool.py).
    #
    # Warum docker-entrypoint.sh nochmal aufgerufen wird: das aeussere bash
    # laeuft schon ueber den Entrypoint des Images, der ueberspringt dabei die
    # Erstinitialisierung. Der zweite Aufruf mit 'postgres' als Argument holt sie
    # nach, sonst wuerde ein frisches Volume nie angelegt. Getestet mit leerem
    # und mit bestehendem Volume.
    command: >
      bash -c '
      RAM_MB=$$(awk "/MemTotal/ {print int(\$$2/1024)}" /proc/meminfo);
      SHARED=$$(( RAM_MB / 8 )); [ "$$SHARED" -lt 128 ] && SHARED=128;
      CACHE=$$(( RAM_MB / 2 ));
      MAINT=$$(( RAM_MB / 16 )); [ "$$MAINT" -lt 64 ] && MAINT=64; [ "$$MAINT" -gt 512 ] && MAINT=512;
      CONNS=$$(( RAM_MB / 40 )); [ "$$CONNS" -lt 100 ] && CONNS=100; [ "$$CONNS" -gt 300 ] && CONNS=300;
      echo "kis-postgres: $${RAM_MB}MB RAM erkannt, shared_buffers=$${SHARED}MB, maintenance_work_mem=$${MAINT}MB, max_connections=$${CONNS}";
      exec docker-entrypoint.sh postgres
      -c shared_buffers=$${SHARED}MB
      -c effective_cache_size=$${CACHE}MB
      -c maintenance_work_mem=$${MAINT}MB
      -c max_connections=$${CONNS}
      '
    # Muss mitwachsen, sonst scheitert der Bau des hnsw-Index. Parallele
    # Index-Arbeit legt ihren Speicher in /dev/shm ab, und das hat im Container
    # standardmaessig nur 64 MB. Mit einem groesseren maintenance_work_mem
    # verlangt Postgres dort mehr und bricht sonst mit "No space left on device"
    # ab. Beim Testen genau so passiert. Der Wert ist eine Obergrenze, kein
    # reservierter Speicher, ungenutzt kostet er nichts.
    shm_size: 1gb
    volumes:
      - kis-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kis} -d ${POSTGRES_DB:-kis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kis-backend
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - ./backend/tests:/app/tests:ro
      # Auswertungs- und Messskripte. Sie brauchen die echte Datenbank und die
      # echten Einbettungen, laufen also im Container:
      #   docker exec kis-backend python scripts/rag_retrieval_eval.py
      - ./backend/scripts:/app/scripts:ro
      # pytest config (testpaths + asyncio_mode). Without it, in-container test
      # runs need `-o asyncio_mode=auto` and 18 async tests fail as "not supported".
      - ./backend/pytest.ini:/app/pytest.ini:ro
      - kis-storage:/app/storage
    ports:
      # Nur an localhost binden, nicht ans oeffentliche Interface. nginx und der
      # Frontend-Container erreichen das Backend intern ueber das Docker-Netz
      # (backend:8000); nur lokale Host-Tools brauchen den veroeffentlichten Port.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Macht sichtbar, ob der Prozess noch antwortet. Ein abgestuerzter Prozess
    # wird schon von restart:unless-stopped aufgefangen, ein HAENGENDER nicht,
    # und genau der ist der wahrscheinlichere Fall.
    # ACHTUNG: Docker Compose startet einen ungesunden Container NICHT von
    # selbst neu, es zeigt ihn nur als "unhealthy" in `docker ps`. Fuer echten
    # Selbstheilungsbetrieb braucht es zusaetzlich einen Watchdog.
    # curl ist im Image nicht vorhanden, deshalb ueber python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Der Start dauert gemessen 20 bis 35 Sekunden (Schema, Storage, Routen).
      # Ohne diese Karenz waere der Container beim Hochfahren sofort ungesund.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-screencast:
    build: ./backend
    container_name: kis-celery-screencast
    # Obergrenze aus den Kernen statt fest. Die Formel ergibt auf der heutigen
    # 4-Kern-Box exakt die bisherige 2, waechst aber bei einem groesseren Server
    # mit. Screencast bleibt bewusst der sparsamste Worker: Rendern und PPTX
    # umwandeln lasten Kerne dauerhaft voll aus.
    command: >
      sh -c 'K=$$(nproc 2>/dev/null || echo 2);
      C=$$(( K / 2 )); [ "$$C" -lt 2 ] && C=2; [ "$$C" -gt 4 ] && C=4;
      echo "kis-celery-screencast: $${K} Kern(e), concurrency=$${C}";
      exec celery -A src.celery_app worker --queues=screencast --concurrency=$$C --loglevel=info'
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-general:
    build: ./backend
    container_name: kis-celery-general
    # Obergrenze aus den Kernen. Ergibt auf 4 Kernen die bisherige 10. Hoeher als
    # bei screencast, weil hier vor allem gewartet wird (Vertonung, Uebersetzung,
    # Bilder gehen an fremde Server). Die Ausnahme ist das Transkribieren, das
    # ffmpeg-Vorspiel dazu rechnet echt.
    command: >
      sh -c 'K=$$(nproc 2>/dev/null || echo 4);
      M=$$(( K * 5 / 2 )); [ "$$M" -lt 2 ] && M=2; [ "$$M" -gt 16 ] && M=16;
      echo "kis-celery-general: $${K} Kern(e), autoscale=$${M},2";
      exec celery -A src.celery_app worker --queues=tts,general --autoscale=$$M,2 --loglevel=info'
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-aia:
    build: ./backend
    container_name: kis-celery-aia
    # Obergrenze aus den Kernen. Ergibt auf 4 Kernen die bisherige 12. Die
    # Studio-Werkzeuge und das Einlesen warten die meiste Zeit auf das KI-Modell.
    command: >
      sh -c 'K=$$(nproc 2>/dev/null || echo 4);
      M=$$(( K * 3 )); [ "$$M" -lt 2 ] && M=2; [ "$$M" -gt 16 ] && M=16;
      echo "kis-celery-aia: $${K} Kern(e), autoscale=$${M},2";
      exec celery -A src.celery_app worker --queues=aia --autoscale=$$M,2 --loglevel=info'
    # Deckel gegen einen einzelnen Ausreisser, damit ein grosses Dokument nicht
    # Postgres aus dem Speicher draengt. Bisher fest auf 1.5g, was auf einer
    # groesseren Box unnoetig bremst. Jetzt ueber die .env anpassbar, Standard
    # bleibt der alte Wert, damit sich heute nichts aendert.
    mem_limit: ${CELERY_AIA_MEM_LIMIT:-1.5g}
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-beat:
    build: ./backend
    container_name: kis-celery-beat
    command: celery -A src.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-celerybeat:/app/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  openldap:
    image: osixia/openldap:latest
    container_name: kis-openldap
    environment:
      LDAP_ORGANISATION: TH Luebeck
      LDAP_DOMAIN: th-luebeck.de
      # In prod ueber .env auf ein starkes Passwort setzen. Default nur fuer
      # lokale Entwicklung. Achtung: osixia/openldap setzt das Admin-Passwort
      # nur beim ERSTEN Init im Volume, ein spaeterer Wechsel braucht ldappasswd
      # oder ein frisches Volume.
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      LDAP_TLS: "false"
    ports:
      # Nur localhost. Das Backend erreicht LDAP intern ueber das Docker-Netz
      # (LDAP_SERVER=kis-openldap), niemand von aussen. Frueher lag 389 offen
      # auf 0.0.0.0, also am oeffentlichen Interface der Prod-Box.
      - "127.0.0.1:389:389"
    volumes:
      - ./docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
      - kis-openldap-data:/var/lib/ldap
      - kis-openldap-config:/etc/ldap/slapd.d
    command: --copy-service
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-D", "cn=admin,dc=th-luebeck,dc=de", "-w", "${LDAP_ADMIN_PASSWORD:-admin}", "-b", "dc=th-luebeck,dc=de"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ldap-init:
    image: alpine:latest
    container_name: kis-ldap-init
    command: >
      sh -c "
        apk add --no-cache openldap-clients &&
        ldapadd -x -H ldap://openldap -D 'cn=admin,dc=th-luebeck,dc=de' -w '${LDAP_ADMIN_PASSWORD:-admin}' -f /seed/seed.ldif 2>&1 || true
      "
    volumes:
      - ./docker/ldap/seed.ldif:/seed/seed.ldif:ro
    depends_on:
      openldap:
        condition: service_healthy
    restart: "no"

volumes:
  kis-postgres-data:
  kis-celerybeat:
  kis-storage:
  kis-openldap-data:
  kis-openldap-config:
