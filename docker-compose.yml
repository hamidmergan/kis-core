services:
  redis:
    image: redis:alpine
    container_name: kis-redis
    restart: unless-stopped
    # No ports exposed - only accessible via internal Docker network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kis-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kis-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-kis}
    volumes:
      - kis-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kis} -d ${POSTGRES_DB:-kis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kis-backend
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - kis-storage:/app/storage
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-screencast:
    build: ./backend
    container_name: kis-celery-screencast
    command: celery -A src.celery_app worker --queues=screencast --concurrency=2 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-general:
    build: ./backend
    container_name: kis-celery-general
    command: celery -A src.celery_app worker --queues=tts,general --autoscale=10,2 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-kia:
    build: ./backend
    container_name: kis-celery-kia
    command: celery -A src.celery_app worker --queues=kia --autoscale=6,2 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-beat:
    build: ./backend
    container_name: kis-celery-beat
    command: celery -A src.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-celerybeat:/app/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  adminer:
    profiles: ["adminer"]
    image: adminer:latest
    container_name: kis-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: kis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  minio:
    profiles: ["minio"]
    image: minio/minio
    container_name: kis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kis-minio-data:/data
    restart: unless-stopped

  kokoro:
    profiles: ["kokoro"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kis-kokoro
    environment:
      - API_KEY=${KOKORO_API_KEY:-kokoro-local-key}
    ports:
      - "8880:8880"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  kokoro-gpu:
    profiles: ["kokoro-gpu"]
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kis-kokoro
    environment:
      - API_KEY=${KOKORO_API_KEY:-kokoro-local-key}
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  thorsten:
    profiles: ["thorsten"]
    build: ./thorsten
    container_name: kis-thorsten
    ports:
      - "5002:5002"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    container_name: kis-ollama
    ports:
      - "11434:11434"
    volumes:
      - kis-ollama-data:/root/.ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  openldap:
    profiles: ["ldap"]
    image: tiredofit/openldap:latest
    container_name: kis-openldap
    environment:
      HOSTNAME: openldap
      ORGANIZATION: TH Luebeck
      DOMAIN: th-luebeck.de
      ADMIN_PASS: admin
      ENABLE_TLS: "FALSE"
      LOG_LEVEL: 256
    ports:
      - "389:389"
    volumes:
      - ./ldap/seed.ldif:/assets/slapd/bootstrap/ldif/seed.ldif
      - kis-openldap-data:/var/lib/ldap
      - kis-openldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-D", "cn=admin,dc=th-luebeck,dc=de", "-w", "admin", "-b", "dc=th-luebeck,dc=de"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ldap-init:
    profiles: ["ldap"]
    image: alpine:latest
    container_name: kis-ldap-init
    command: >
      sh -c "
        apk add --no-cache openldap-clients &&
        ldapadd -x -H ldap://openldap -D 'cn=admin,dc=th-luebeck,dc=de' -w admin -f /seed/seed.ldif 2>&1 || true
      "
    volumes:
      - ./ldap/seed.ldif:/seed/seed.ldif:ro
    depends_on:
      openldap:
        condition: service_healthy
    restart: "no"

  langfuse-db-init:
    profiles: ["langfuse"]
    image: postgres:16-alpine
    container_name: kis-langfuse-db-init
    command: >
      sh -c "psql postgresql://kis:kis-local-dev@postgres:5432/kis -c 'CREATE DATABASE langfuse;' 2>/dev/null || true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    profiles: ["langfuse"]
    image: langfuse/langfuse:2
    container_name: kis-langfuse
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://kis:kis-local-dev@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-local-secret-change-in-prod
      SALT: langfuse-local-salt-change-in-prod
      LANGFUSE_INIT_ORG_ID: kis
      LANGFUSE_INIT_ORG_NAME: KIS-THL
      LANGFUSE_INIT_PROJECT_ID: kia
      LANGFUSE_INIT_PROJECT_NAME: KI-Tutor
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: lf-pk-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: lf-sk-local
      LANGFUSE_INIT_USER_EMAIL: admin@th-luebeck.de
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  phpldapadmin:
    profiles: ["ldapadmin"]
    image: osixia/phpldapadmin:latest
    container_name: kis-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8090:80"
    depends_on:
      - openldap
    restart: unless-stopped

volumes:
  kis-postgres-data:
  kis-celerybeat:
  kis-storage:
  kis-minio-data:
  kis-openldap-data:
  kis-openldap-config:
  kis-ollama-data:
