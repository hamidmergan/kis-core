services:
  redis:
    image: redis:alpine
    container_name: kis-redis
    restart: unless-stopped
    # No ports exposed - only accessible via internal Docker network

  backend:
    build: ./backend
    container_name: kis-backend
    env_file:
      - .env
    volumes:
      - ./backend/demo:/app/demo:ro
      - kis-db:/app/data
      - kis-storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-screencast:
    build: ./backend
    container_name: kis-celery-screencast
    command: celery -A src.celery_app worker --queues=screencast --autoscale=2,1 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/demo:/app/demo:ro
      - kis-db:/app/data
      - kis-storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-tts:
    build: ./backend
    container_name: kis-celery-tts
    command: celery -A src.celery_app worker --queues=tts --autoscale=6,1 --loglevel=info
    env_file:
      - .env
    volumes:
      - kis-db:/app/data
      - kis-storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-dubbing:
    build: ./backend
    container_name: kis-celery-dubbing
    command: celery -A src.celery_app worker --queues=dubbing --autoscale=4,1 --loglevel=info
    env_file:
      - .env
    volumes:
      - kis-db:/app/data
      - kis-storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-beat:
    build: ./backend
    container_name: kis-celery-beat
    command: celery -A src.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - kis-db:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: kis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  openldap:
    profiles: ["ldap"]
    image: tiredofit/openldap:latest
    container_name: kis-openldap
    environment:
      HOSTNAME: openldap
      ORGANIZATION: TH Luebeck
      DOMAIN: th-luebeck.de
      ADMIN_PASS: admin
      ENABLE_TLS: "FALSE"
      LOG_LEVEL: 256
    ports:
      - "389:389"
    volumes:
      - ./ldap/seed.ldif:/assets/slapd/bootstrap/ldif/seed.ldif
      - kis-openldap-data:/var/lib/ldap
      - kis-openldap-config:/etc/ldap/slapd.d
    restart: unless-stopped

volumes:
  kis-db:
  kis-storage:
  kis-openldap-data:
  kis-openldap-config:
