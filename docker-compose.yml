services:
  redis:
    image: redis:alpine
    container_name: kis-redis
    restart: unless-stopped
    # Holds every waiting job. When memory runs out the kernel takes a worker first,
    # whose job the watchdog brings back, never the queue itself.
    oom_score_adj: -900
    # No ports exposed - only accessible via internal Docker network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kis-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kis-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-kis}
    # Compute the memory values from the available RAM instead of hard-coding them.
    # Without a value Postgres takes 128 MB shared_buffers no matter how big the
    # server is. That is a starting value for tiny systems, not an operating value.
    # With this line everything adapts by itself after a server upgrade, without
    # anyone having to think of it.
    #
    # One EIGHTH of the RAM as shared_buffers, not the quarter from the Postgres
    # docs. Reason: the quarter rule is for a pure database server. Here backend,
    # frontend, three Celery containers, nginx and MinIO run on the same
    # machine as well.
    #
    # Measured on 2026-07-29 (hnsw search, 823 MB index, 138,511 chunks):
    #   128 MB  -> 0.9 ms per search
    #   1983 MB -> 0.6 ms per search
    # So the gain is 0.3 ms while a chat request takes seconds. Reason for the small
    # difference: the operating system keeps the index file in its own cache anyway.
    # A large shared_buffers takes the space away from exactly that cache.
    #
    # Why not stay at 128 MB then: the operating system cache is guaranteed to
    # nobody. A video transcription or several uploads push the index data out of it.
    # shared_buffers is not pushed out. Just under a gigabyte is the insurance
    # against that, without taking 2 GB from the rest of the platform.
    #
    # effective_cache_size stays at half the RAM, that is only an estimate for the
    # query planner and allocates nothing. max_connections grows along, because with
    # several backend processes and the Celery workers each gets its own connection
    # pool (core/db/pool.py).
    #
    # Why docker-entrypoint.sh is called again: the outer bash already runs through
    # the image entrypoint, which skips the first-time initialisation. The second
    # call with 'postgres' as the argument does it, otherwise a fresh volume would
    # never be created. Tested with an empty and with an existing volume.
    command: >
      bash -c '
      RAM_MB=$$(awk "/MemTotal/ {print int(\$$2/1024)}" /proc/meminfo);
      SHARED=$$(( RAM_MB / 8 )); [ "$$SHARED" -lt 128 ] && SHARED=128;
      CACHE=$$(( RAM_MB / 2 ));
      MAINT=$$(( RAM_MB / 16 )); [ "$$MAINT" -lt 64 ] && MAINT=64; [ "$$MAINT" -gt 512 ] && MAINT=512;
      CONNS=$$(( RAM_MB / 40 )); [ "$$CONNS" -lt 100 ] && CONNS=100; [ "$$CONNS" -gt 300 ] && CONNS=300;
      echo "kis-postgres: $${RAM_MB}MB RAM erkannt, shared_buffers=$${SHARED}MB, maintenance_work_mem=$${MAINT}MB, max_connections=$${CONNS}";
      exec docker-entrypoint.sh postgres
      -c shared_buffers=$${SHARED}MB
      -c effective_cache_size=$${CACHE}MB
      -c maintenance_work_mem=$${MAINT}MB
      -c max_connections=$${CONNS}
      '
    # Has to grow along, otherwise building the hnsw index fails. Parallel index work
    # puts its memory in /dev/shm, and in a container that has only 64 MB by default.
    # With a larger maintenance_work_mem Postgres demands more there and otherwise
    # aborts with "No space left on device". Happened exactly like that in testing.
    # The value is a ceiling, not reserved memory, unused it costs nothing.
    shm_size: 1gb
    # Load test 2026-09-26: without this the kernel killed Postgres first when memory ran
    # out, and every running job lost its database at once. Workers are cheaper to lose,
    # the watchdog restarts their jobs.
    oom_score_adj: -900
    volumes:
      - kis-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kis} -d ${POSTGRES_DB:-kis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # One image for all backend containers, only this service builds it.
    build: ./backend
    image: kis-backend
    container_name: kis-backend
    env_file:
      - .env
    environment:
      # Free database connections each web process keeps open, see core/db/pool.py.
      DB_POOL_KEEP_IDLE: "12"
      # glibc gives every thread its own memory area that is never handed back, in the load
      # test of 2026-09-27 that held 500 to 600 MB per web process. Two areas are enough here.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - ./backend/tests:/app/tests:ro
      # Evaluation and measurement scripts. They need the real database and the real
      # embeddings, so they run in the container:
      # docker exec kis-backend python scripts/rag_retrieval_eval.py
      - ./backend/scripts:/app/scripts:ro
      # pytest config (testpaths + asyncio_mode). Without it, in-container test
      # runs need `-o asyncio_mode=auto` and 18 async tests fail as "not supported".
      - ./backend/pytest.ini:/app/pytest.ini:ro
      - kis-storage:/app/storage
    ports:
      # Bind to localhost only, not to the public interface. nginx and the frontend
      # container reach the backend internally over the Docker network (backend:8000);
      # only local host tools need the published port.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Three processes of about 300 MB on 4 cores plus LibreOffice and ffmpeg for uploads.
    # The limit keeps a runaway conversion inside this container. The upload slots are
    # derived from it (1 GB each), 3g keeps the previous 3 slots of the 4 core box.
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    # Serves every page. When memory runs out the kernel takes a worker before this,
    # the watchdog restarts the worker's job, the pages stay usable meanwhile.
    oom_score_adj: -500
    # Makes it visible whether the process still answers. A crashed process is
    # already caught by restart:unless-stopped, a HANGING one is not, and that is
    # the more likely case.
    # NOTE: Docker Compose does NOT restart an unhealthy container by itself, it
    # only shows it as "unhealthy" in `docker ps`. Real self-healing needs an extra
    # watchdog. curl is not in the image, hence via python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The start takes a measured 20 to 35 seconds (schema, storage, routes). Without
      # this grace period the container would be unhealthy right at boot.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-screencast:
    image: kis-backend
    container_name: kis-celery-screencast
    profiles: ["tools"]
    # Ceiling from the cores instead of fixed. On today's 4-core box the formula
    # gives exactly the previous 2, but it grows with a bigger server. Screencast
    # stays the most frugal worker on purpose: rendering and PPTX conversion keep
    # cores fully busy.
    command: >
      sh -c 'K=$$(nproc 2>/dev/null || echo 2);
      C=$$(( K / 2 )); [ "$$C" -lt 2 ] && C=2; [ "$$C" -gt 4 ] && C=4;
      echo "kis-celery-screencast: $${K} Kern(e), concurrency=$${C}";
      exec celery -A src.celery_app worker --queues=screencast --concurrency=$$C --loglevel=info'
    # Cap so that too many ffmpeg clips at once only hit this worker, never Postgres or
    # the backend. The render threads read this limit and stay below it.
    mem_limit: ${CELERY_SCREENCAST_MEM_LIMIT:-2g}
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/demo:/app/demo:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-general:
    image: kis-backend
    container_name: kis-celery-general
    # Short services: translation, transcription, images. They take seconds
    # to a few minutes and never wait behind a summary, presentation or podcast script, those
    # run in celery-worker-long. Mostly waiting on other servers, except the ffmpeg
    # prelude of a transcription. One process per core, 4 on 4 cores: with 200-page
    # documents a process holds up to 290 MB plus ffmpeg. More work waits in the queue.
    # CELERY_GENERAL_PROCESSES in .env overrides the count, for a language model that answers many calls at once.
    command: >
      sh -c 'K=$$(nproc 2>/dev/null || echo 4);
      M=$$K; [ "$$M" -lt 2 ] && M=2; [ "$$M" -gt 8 ] && M=8; M=$${CELERY_GENERAL_PROCESSES:-$$M};
      echo "kis-celery-general: $${K} Kern(e), autoscale=$${M},1";
      exec celery -A src.celery_app worker --queues=general --autoscale=$$M,1 --loglevel=info'
    mem_limit: ${CELERY_GENERAL_MEM_LIMIT:-1.5g}
    # TERM starts the soft shutdown (worker_soft_shutdown_timeout), unfinished tasks go
    # back in line, Docker waits for that instead of killing after 10 s.
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-long:
    image: kis-backend
    container_name: kis-celery-long
    # Long services: summary, presentation outline and build, podcast script, the nightly backup.
    # One of them holds a process for minutes, mostly waiting on the language and image
    # models, so they get their own worker and short services pass by. Two processes per core
    # less two, 6 on 4 cores: they wait almost all the time (load test 19 on 29.09.2026, median 0.2 %
    # of a core), but each holds up to 340 MB, 10 processes ran out of 2.5 GB in load test 20.
    # CELERY_LONG_PROCESSES in .env overrides the count.
    command: >
      sh -c 'K=$$(nproc 2>/dev/null || echo 4);
      M=$$(( K * 2 - 2 )); [ "$$M" -lt 2 ] && M=2; [ "$$M" -gt 6 ] && M=6; M=$${CELERY_LONG_PROCESSES:-$$M};
      echo "kis-celery-long: $${K} Kern(e), autoscale=$${M},1";
      exec celery -A src.celery_app worker --queues=long --autoscale=$$M,1 --loglevel=info'
    mem_limit: ${CELERY_LONG_MEM_LIMIT:-2g}
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-voice:
    image: kis-backend
    container_name: kis-celery-voice
    # Read aloud and podcast voicing. The voice provider manages only a few requests at
    # once (measured 2026-09-26 at myLab: 4), every tool shares those seats. More
    # processes than seats would only wait, so four are enough on any server size.
    command: >
      sh -c 'echo "kis-celery-voice: concurrency=4";
      exec celery -A src.celery_app worker --queues=tts --concurrency=4 --loglevel=info'
    mem_limit: ${CELERY_VOICE_MEM_LIMIT:-1.25g}
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-control:
    image: kis-backend
    container_name: kis-celery-control
    # Only the watchdog, in a single process. It has to run exactly when every other
    # worker is busy, it restarts their jobs and frees their slots.
    command: celery -A src.celery_app worker --queues=control --pool=solo --loglevel=info
    mem_limit: ${CELERY_CONTROL_MEM_LIMIT:-512m}
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-worker-aia:
    image: kis-backend
    container_name: kis-celery-aia
    profiles: ["aia"]
    # One process per slot of the Francis pool (AIA_PARALLEL_SLOTS = 18), the pool
    # decides what runs, so no job waits here behind another. Tools mostly wait on
    # the language model, sources are capped at 3 (AIA_AREA_CAPS) because a
    # 155-page PDF takes a process to 365 MB.
    command: >
      sh -c 'echo "kis-celery-aia: autoscale=18,1";
      exec celery -A src.celery_app worker --queues=aia,aia_ingest --autoscale=18,1 --loglevel=info'
    # Cap against a single outlier so a large document does not push Postgres out of
    # memory. 3 sources of up to 365 MB, 15 tools and the main process fit in 3g.
    # Adjustable via the .env.
    mem_limit: ${CELERY_AIA_MEM_LIMIT:-3g}
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  celery-beat:
    image: kis-backend
    container_name: kis-celery-beat
    command: celery -A src.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src:ro
      - kis-celerybeat:/app/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  # Profile "app": on for a normal start and on the servers, off in development,
  # where port 3000 belongs to the Next.js dev server.
  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kis-frontend
    # Serves every page, when memory runs out the kernel takes a worker before this.
    oom_score_adj: -500
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # localhost only, a reverse proxy in front reaches it from there.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Profile "minio": local object storage, the servers use an external S3 instead.
  minio:
    profiles: ["minio"]
    image: minio/minio
    container_name: kis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      # localhost only, nothing is published to the network
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kis-minio-data:/data
    restart: unless-stopped

  # Profile "hpc": SSH tunnel to the running HPC jobs, providers reach it as http://hpc-tunnel:<port>.
  hpc-tunnel:
    profiles: ["hpc"]
    build: ./deploy/hpc-tunnel
    container_name: kis-hpc-tunnel
    environment:
      HPC_LOGIN: ${HPC_LOGIN:-}
    volumes:
      # Private key registered at Academic Cloud for the HPC account, mode 600.
      - ${HPC_SSH_KEY:-${HOME}/.ssh/kis-hpc}:/run/hpc/key:ro
      - kis-hpc-tunnel:/state
    restart: unless-stopped

volumes:
  kis-postgres-data:
  kis-celerybeat:
  kis-storage:
  kis-minio-data:
  kis-hpc-tunnel:
