name: CI

# Runs on every push to any branch, so you get green/red right after a push
# without opening a PR first. The check is attached to the commit, so an open
# PR shows the same result. The live @e2e tests (need a running stack + LLM)
# are deselected here; they run separately.
on:
  push:
    branches:
      - '**'

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres mit pgvector, damit die Tests laufen, die echtes SQL anfassen. Ohne
    # ihn ueberspringen sich rund 76 Tests still, also wird genau der Teil nicht
    # geprueft, der am ehesten kaputt geht. Das Abbild bringt die Erweiterung
    # `vector` schon mit, `pg_trgm` steckt in Postgres selbst.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Baut das Schema von null auf, so wie es eine neue Hochschule auch tut.
      # Faellt dieser Schritt um, ist die Reihenfolge im Schema kaputt, siehe
      # scripts/check_fresh_schema.sh.
      - name: Schema anlegen
        run: python -c "from src.core.db.schema import init_db; init_db()"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -m "not e2e" \
            --cov=src --cov-config=.coveragerc \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Backend coverage: $(python -m coverage report --format=total)%"
            echo ""
            echo "<details><summary>Per-file breakdown</summary>"
            echo ""
            python -m coverage report --format=markdown
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          retention-days: 14

  frontend:
    name: Frontend (tsc + i18n + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: i18n key parity
        run: npm run check:i18n

      - name: No hard-coded pixel font sizes
        run: npm run check:units

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total; console.log(`### Frontend coverage: ${t.lines.pct}% lines, ${t.functions.pct}% functions, ${t.branches.pct}% branches`)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14
